<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard งานตรวจ DNA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: แถบเมนูสีเลือดหมู (ตามสีตราหน่วยงาน) + พื้นที่ Dashboard การ์ดบนพื้นอุ่น · เลือกแหล่งข้อมูลได้ที่มุมขวาบน
   Tokens: เลือดหมู=แบรนด์/ตัวชี้เน้น · สเลท=ปีก่อน/บริบท · ชุดสีหมวดงบใช้พาเลตที่ผ่านการตรวจแล้ว */
:root{
  --bg:#f4efee; --surface:#ffffff; --surface-2:#faf6f5; --ink:#1f1315; --ink-2:#5b4a4d; --muted:#6b5b5e;
  --line:#eadfdf; --grid:#ece4e3; --axis:#cdbfc0;
  --brand:#6b1219; --brand-2:#8e2631; --on-brand:#ffffff; --brand-soft:#f3e3e4;
  --side:#4a0d13; --side-ink:#f6e9ea; --side-muted:#d8b9bc; --side-line:rgba(255,255,255,.12);
  --s1:#7a1f2b; --s2:#7a859b;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --live:#0ca30c; --warn:#8a5a00; --bad:#a82424; --warn-bg:#fdf1d6; --bad-bg:#fbe3e3;
  --shadow:0 1px 2px rgba(60,20,25,.06),0 6px 20px rgba(60,20,25,.05);
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150d0f; --surface:#211618; --surface-2:#291c1f; --ink:#f5eceb; --ink-2:#cdbcbe; --muted:#98878a;
  --line:#352729; --grid:#2e2224; --axis:#4a3a3d;
  --brand:#b5434f; --brand-2:#cf5f6b; --on-brand:#ffffff; --brand-soft:#3a1d22;
  --side:#2a0a0e; --side-ink:#f6e9ea; --side-muted:#c9a9ac; --side-line:rgba(255,255,255,.1);
  --s1:#e48a93; --s2:#7f8aa1;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --live:#2bc22b; --warn:#f0b43a; --bad:#ec6a6a; --warn-bg:#3a2d10; --bad-bg:#4a1f22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#150d0f; --surface:#211618; --surface-2:#291c1f; --ink:#f5eceb; --ink-2:#cdbcbe; --muted:#98878a;
  --line:#352729; --grid:#2e2224; --axis:#4a3a3d;
  --brand:#b5434f; --brand-2:#cf5f6b; --on-brand:#ffffff; --brand-soft:#3a1d22;
  --side:#2a0a0e; --side-ink:#f6e9ea; --side-muted:#c9a9ac; --side-line:rgba(255,255,255,.1);
  --s1:#e48a93; --s2:#7f8aa1;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --live:#2bc22b; --warn:#f0b43a; --bad:#ec6a6a; --warn-bg:#3a2d10; --bad-bg:#4a1f22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

::selection{background:var(--brand-soft);color:var(--ink)}
input,select{caret-color:var(--brand-2);accent-color:var(--brand)}
::placeholder{color:var(--muted);opacity:1}
*{scrollbar-color:var(--axis) transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:10px;z-index:100;text-decoration:none}
.skip:focus{left:8px}
.side :focus-visible{outline-color:#fff}
.rowbtn{all:unset;cursor:pointer;color:inherit;font:inherit;border-radius:6px;display:inline-block}
.rowbtn:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px}
.tri{width:9px;height:9px;flex:none}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:28px max(20px,env(safe-area-inset-left,0px)) 20px 20px;gap:22px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.logo{width:88px;height:88px;border-radius:50%;background:#fff;padding:0;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.brand b{display:block;font-size:17px;line-height:1.3;font-weight:600}
.brand span{display:block;font-size:12px;color:var(--side-muted);letter-spacing:.02em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--side-ink);text-decoration:none;font-weight:500;opacity:.82}
.nav a:hover{background:rgba(255,255,255,.07);opacity:1}
.nav a[aria-current="page"]{background:#fff;color:var(--brand);opacity:1;font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.nav hr{border:0;border-top:1px solid var(--side-line);margin:8px 6px;width:calc(100% - 12px)}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:16px;font-size:12px;color:var(--side-muted);line-height:1.5}

.main{min-width:0}
.main-in{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:26px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);max-width:100%}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.pill.live .dot{background:var(--live);animation:pulse 2s infinite}
.pill.static .dot{background:var(--warn)}
.pill.lost .dot{background:var(--bad)}
.pill.busy .dot{background:var(--c1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sel{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:min(340px,100%);font-weight:600;cursor:pointer;color:var(--ink)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}

.fy{display:flex;align-items:center;gap:10px;min-width:0}
.fy-l{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px;scrollbar-width:thin;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.chip:hover{border-color:var(--brand-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}

#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.latest{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--brand-soft);color:var(--ink);font-size:13px}
.latest b{font-weight:600}
.latest .tag{color:var(--brand);font-weight:600}
:root[data-theme="dark"] .latest .tag{color:var(--s1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .latest .tag{color:var(--s1)}}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{font-size:12.5px;color:var(--ink-2)}
.kpi{container-type:inline-size}
.kpi-v{font-size:clamp(20px,13cqw,28px);line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi-s{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.kpi.hero{background:var(--brand);color:var(--on-brand)}
.kpi.hero .kpi-l,.kpi.hero .kpi-s{color:rgba(255,255,255,.82)}
.delta{display:inline-flex;gap:3px;align-items:center;font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi.hero .delta{background:rgba(255,255,255,.18);color:#fff}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c4) 45%,transparent)}100%{background:transparent}}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 14px;min-width:0;position:relative}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.card-h h2{font-size:15.5px;margin:0;font-weight:600;line-height:1.35}
.card-h p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.link{background:none;border:1px solid var(--line);border-radius:8px;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.link:hover{background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 4px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.tview{overflow-x:auto;max-height:300px}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:12px;color:var(--ink-2);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
td.w{white-space:normal}
tbody tr:hover td{background:var(--surface-2)}
tr.sel td{background:var(--brand-soft);font-weight:600}
tr.clk{cursor:pointer}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;margin:1px 2px 1px 0}
.badge.ok{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.badge.bad{background:var(--bad-bg);color:var(--bad)}

.hl{display:flex;flex-direction:column;margin:4px 0 0;padding:0;list-style:none}
.hl li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.hl li:last-child{border:0}
.hl span{color:var(--ink-2)}
.hl b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.hb{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.hb li{display:grid;grid-template-columns:minmax(80px,1.2fr) minmax(60px,2fr) auto;gap:10px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l small{color:var(--muted);margin-left:6px}
.hb-b{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:block}
.hb-b i{display:block;height:100%;border-radius:0 6px 6px 0;background:var(--s1)}
.hb b{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.2em;text-align:right}
.hb em{grid-column:2 / -1;margin-top:-4px;font-style:normal;font-size:11.5px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.toolbar label{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;color:var(--ink-2)}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.mx td.z{color:var(--muted)}
.mx tr.dr td{background:var(--brand-soft)}
.mx tbody tr[data-dk]{cursor:pointer}
.mx tfoot td{font-weight:600;border-top:2px solid var(--line)}
.search{width:min(280px,100%);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;background:var(--brand);color:var(--on-brand);cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:wait}

.srcs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src.on{background:var(--brand-soft);margin-inline:-12px;padding-inline:12px;border-radius:10px;border-bottom-color:transparent}
.src h3{margin:0;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.src p{margin:2px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.src .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:13px}
.steps b{color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.two>div{border-top:1px solid var(--line);padding:12px 0 0;font-size:12.5px;color:var(--ink-2)}
.two h4{margin:0 0 4px;color:var(--ink);font-size:13px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);padding:1px 6px;border-radius:6px}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.notes li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.notes li.h{display:block;font-weight:600;color:var(--ink);font-size:13.5px;padding-top:16px}
.notes li b{color:var(--muted);font-weight:500}
.msg{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.msg.ok{background:color-mix(in srgb,var(--live) 14%,var(--surface));color:var(--ink)}
.msg.err{background:var(--bad-bg);color:var(--ink)}
.msg.warn{background:var(--warn-bg);color:var(--ink)}

.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:600;font-size:13px}
.f small{color:var(--muted);font-size:12px}
.f input,.f select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#formCard details{padding:10px 0}
#formCard summary{cursor:pointer;font-weight:600;font-size:13px}
#formCard details .f2{margin-top:10px}
#formCard .f{margin-bottom:14px}
#formCard .row{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--brand) 78%,transparent);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:600;z-index:80;pointer-events:none}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:12.5px;min-width:150px;max-width:260px}
#tip h4{margin:0 0 6px;font-size:12.5px;font-weight:600}
#tip .r{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:1.5px 0}
#tip .r span:first-child{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
#tip .r i{width:9px;height:9px;border-radius:3px;display:inline-block}
#tip .r b{font-variant-numeric:tabular-nums;font-weight:600}
#tip .ft{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted)}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-8,.span-7,.span-5,.span-4,.span-6{grid-column:span 12}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{flex-direction:row;align-items:center;gap:12px}.logo{width:52px;height:52px}.brand b{font-size:15px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:6px;order:3}.nav a{padding:8px 14px;white-space:nowrap}.nav hr{display:none}
  .side-foot{display:none}
  .main-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .top h1{font-size:22px}
}
@media (max-width:560px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-v{font-size:23px}.fy{width:100%}.card{padding:14px 12px 10px}
  .src{grid-template-columns:minmax(0,1fr)}.src .acts{justify-content:flex-start}.two,.f2{grid-template-columns:1fr}.tools{width:100%}.sel{flex:1}}
@media (pointer:coarse){.chip,.btn,.btn.sm,.sel,.link,.iconbtn,.search,.nav a,.f input,.f select{min-height:44px}.iconbtn{width:44px}.link{padding:8px 12px}.rowbtn{padding:10px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#" id="skip">ข้ามไปยังเนื้อหา</a>
<div class="app">

const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function needZip(){ if (window.JSZip) return Promise.resolve(); return needZip.p ||= new Promise((res, rej) => {
  const el = document.createElement('script'); el.src = JSZIP_URL; el.onload = res;
  el.onerror = () => { needZip.p = null; rej(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ · ตรวจอินเทอร์เน็ตแล้วลองใหม่')); };
  document.head.appendChild(el); }); }
async function readXlsx(buf){
  await needZip(); const zip = await JSZip.loadAsync(buf);
  const txt = async p => { const f = zip.file(p); return f ? f.async('string') : null; };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = [];
  const sst = await txt('xl/sharedStrings.xml');
  if (sst) for (const si of xml(sst).getElementsByTagName('si'))
    ss.push([...si.getElementsByTagName('t')].filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
  const wbx = xml(await txt('xl/workbook.xml'));
  const rels = xml(await txt('xl/_rels/workbook.xml.rels'));

  for (const r of rels.getElementsByTagName('Relationship')) target[r.getAttribute('Id')] = r.getAttribute('Target');
  const sheets = {};

    let t = target[s.getAttribute('r:id')] || '';
    sheets[s.getAttribute('name')] = t.startsWith('/') ? t.slice(1) : 'xl/' + t;

  async function rows(name){
    const p = sheets[name]; if (!p) return null;
    const raw = await txt(p); if (!raw) return null;
    const out = [];

      const ri = parseInt(row.getAttribute('r'), 10) - 1, arr = [];
      for (const c of row.getElementsByTagName('c')) {
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = null;
        if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else if (v) { const s = v.textContent;
          if (t === 's') val = ss[+s]; else if (t === 'str') val = s; else if (t === 'b') val = s === '1';
          else if (t === 'e') val = null; else val = s === '' ? null : parseFloat(s); }

    return Array.from(out, r => r ? Array.from(r, v => v === undefined ? null : v) : []);

}

/* ---- ตัวเชื่อมเซิร์ฟเวอร์: google.script.run → Promise ---- */
const RUN = (fn, ...args) => new Promise((res, rej) => {
  if (!(window.google && google.script && google.script.run)) return rej(new Error('หน้านี้ต้องเปิดผ่านลิงก์ Web app ของ Apps Script'));
  google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(String((e && e.message) || e).replace(/^(Exception|Error):\s*/, ''))))[fn](...args); });
// ได้ "สมุด" รูปเดียวกับ readXlsx: { names, rows(tab), sig() } วันที่เป็นเลข serial เหมือนไฟล์ Excel
function serverBook(key){
  let p = null; const load = () => p ||= RUN('getBook', key);
  return { names: null, async rows(tab){ const b = await load(); this.names = b.names; return b.tabs[tab] || null; },
    async sig(){ return 's' + (await load()).sig; } };
}
// ดึงแท็บ + ตรวจหัวคอลัมน์
async function getRows(book, tab, head){
  if (book.names && !book.names.includes(tab)) return null;
  const rows = await book.rows(tab);
  if (!rows || !rows.length) return null;
  if (head && !String(rows[0][0] ?? '').startsWith(head)) return null;
  return rows;
}

/* ---------- แม่แบบ lab: ชีตดิบ → โมเดล ---------- */
async function buildLab(book, tabs){
  const [rc, rb, rl] = await Promise.all([getRows(book, tabs.cases, 'ปีงบประมาณ'), getRows(book, tabs.budget, 'ปีงบประมาณ'), getRows(book, tabs.lot, 'ลำดับ')]);
  if (!rc) throw new Error('ไม่พบแท็บ "' + tabs.cases + '" หรือหัวคอลัมน์ไม่ตรงแม่แบบ');
  if (!rb) throw new Error('ไม่พบแท็บ "' + tabs.budget + '" หรือหัวคอลัมน์ไม่ตรงแม่แบบ');
  if (!rl) throw new Error('ไม่พบแท็บ "' + tabs.lot + '" หรือหัวคอลัมน์ไม่ตรงแม่แบบ');
  let rn = []; try { rn = (tabs.notes && await getRows(book, tabs.notes, null)) || []; } catch (e) {}
  const cases = new Map();
  for (const r of rc.slice(1)) { const fy = num(r[0]), idx = num(r[1]); if (!fy || !idx) continue;
    cases.set(fy*100 + idx, { fy, idx, items: num(r[4]), samples: num(r[5]), note: r[6] || '' }); }
  const budget = {}, brows = [];
  for (const r of rb.slice(1)) { const fy = num(r[0]), amt = num(r[3]); if (!fy || amt == null) continue;
    const cat = r[2] || 'อื่นๆ/เหตุพิเศษ'; const b = budget[fy] ||= { cats: {}, waste: 0, total: 0 };
    if (cat === WASTE) b.waste += amt; else { b.cats[cat] = (b.cats[cat] || 0) + amt; b.total += amt; }
    brows.push({ fy, item: r[1], cat, amt, note: r[4] || '' }); }
  const h = rl[0], col = p => h.findIndex(x => typeof x === 'string' && x.startsWith(p));
  const cD = col('วันที่ใช้คำนวณ'), cN = col('Lot No'), cS = col('จำนวนตัวอย่าง'), cSrc = col('ที่มาของวันที่');
  if ([cD, cN, cS].some(x => x < 0)) throw new Error('หัวคอลัมน์ในแท็บ "' + tabs.lot + '" ไม่ตรงแม่แบบ (ต้องมี วันที่ใช้คำนวณ / Lot No. / จำนวนตัวอย่าง)');
  const lots = [];
  for (const r of rl.slice(1)) {
    const d = r[cD], s = num(r[cS]); if (typeof d !== 'number' || s == null) continue;
    const dt = serialDate(d), y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, day = dt.getUTCDate();
    let cy = y, cm = m + (day >= 26 ? 1 : 0); if (cm > 12) { cm = 1; cy++; }
    const src = String(r[cSrc] || '');
    lots.push({ no: String(r[cN] ?? ''), t: dt.getTime(), y, m, day, samples: s, src, est: src.includes('ประมาณการ'),
      cycle: cm, fy: cy + 543 + (cm >= 10 ? 1 : 0), idx: ((cm + 2) % 12) + 1 });
  }
  const years = new Set();
  cases.forEach(c => { if (c.samples != null || c.items != null) years.add(c.fy); });
  Object.keys(budget).forEach(y => budget[y].total > 0 && years.add(+y));
  lots.forEach(l => years.add(l.fy));
  const notes = rn.slice(1).map(r => [r[0], r[1]]).filter(r => r[0] != null || r[1] != null);
  return { kind: 'lab', cases, budget, brows, lots, years: [...years].sort((a, b) => a - b), notes };
}

/* ---------- แม่แบบ cases: ข้อมูลคดี → โมเดล (ไม่อ่านคอลัมน์ User ID LINE) ---------- */
async function buildCases(book, tabs){
  const rows = await getRows(book, tabs.data, 'เลข บก.');
  if (!rows) throw new Error('ไม่พบแท็บ "' + tabs.data + '" หรือหัวคอลัมน์ไม่ตรงแม่แบบ (คอลัมน์แรกต้องเป็น "เลข บก.")');
  const h = rows[0].map(x => String(x ?? '')), ix = p => h.findIndex(x => x.startsWith(p));
  const c = { bk: ix('เลข บก.'), rep: ix('เลขรายงาน'), pol: ix('สภ.'), prov: ix('จังหวัด'), recv: ix('วันที่รับ'), done: ix('วันที่ตรวจเสร็จ'),
    pick: ix('วันที่มารับผล'), st: ix('สถานะ'), typ: ix('ประเภทคดี'), exa: ix('ผู้ตรวจ'), it: ix('ของกลาง'), cnt: ix('นับในสถิติ'), flag: ix('ข้อสังเกต'), thr: ix('เกณฑ์ของกลางผิดปกติ') };
  const miss = ['recv','it','prov','pol','st'].filter(k => c[k] < 0);
  if (miss.length) throw new Error('หัวคอลัมน์ในแท็บ "' + tabs.data + '" ไม่ครบ · ต้องมี: เลข บก. / สภ. / จังหวัด / วันที่รับ / สถานะ / ของกลาง');
  const body = rows.slice(1);
  let thr = 50; if (c.thr >= 0) { const v = body.map(r => r[c.thr]).find(v => typeof v === 'number'); if (v) thr = v; }
  const g = (r, k) => c[k] < 0 ? null : r[c[k]];
  const list = [];
  for (const r of body) {
    const rv = num(g(r, 'recv')); if (rv == null) continue;
    const dt = serialDate(rv), done = num(g(r, 'done')), pick = num(g(r, 'pick'));
    const d1 = done != null && done - rv >= 0 ? Math.round(done - rv) : null;
    const d2 = pick != null && done != null && pick - done >= 0 ? Math.round(pick - done) : null;
    const st = String(g(r, 'st') || '').trim();
    list.push({ bk: String(g(r, 'bk') ?? ''), rep: String(g(r, 'rep') ?? ''), pol: String(g(r, 'pol') || '').trim(), prov: String(g(r, 'prov') || '').trim(),
      t: dt.getTime(), y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, by: dt.getUTCFullYear() + 543, items: num(g(r, 'it')),
      st, done: st === 'รับผลไปแล้ว', wait: st.includes('รอรับผล'), typ: String(g(r, 'typ') || '').trim(), exa: String(g(r, 'exa') || '').trim(),
      counted: g(r, 'cnt') !== 0, flag: String(g(r, 'flag') || '').trim(), d1, d2 });
  }
  if (!list.length) throw new Error('แท็บ "' + tabs.data + '" ไม่มีแถวที่มีวันที่รับ');
  const years = [...new Set(list.filter(r => r.counted).map(r => r.by))].sort((a, b) => a - b);
  return { kind: 'cases', rows: list, thr, years };
}

const measureCtx = document.createElement('canvas').getContext('2d');

  return `<section class="card ${cls}"><div class="card-h"><div><h2>${esc(c.title)}</h2>${c.sub ? `<p>${esc(c.sub)}</p>` : ''}</div><button class="link" data-tv="${id}" aria-pressed="false">ดูเป็นตาราง</button></div>${legend}<div class="chart" id="${id}"></div><div id="${id}t" hidden></div></section>`;
}
const ro = new ResizeObserver(es => { for (const e of es) { const c = CHARTS.find(x => x.id === e.target.id); if (c && !e.target.hidden && e.target.clientWidth) paint(c); } });

function mountCharts(){ ro.disconnect(); CHARTS.forEach(c => { const el = document.getElementById(c.id); if (!el) return; paint(c); ro.observe(el); }); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tv]'); if (!b) return;
  const c = CHARTS.find(x => x.id === b.dataset.tv), el = document.getElementById(c.id), t = document.getElementById(c.id + 't');
  const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.textContent = on ? 'ดูเป็นกราฟ' : 'ดูเป็นตาราง';
  el.hidden = on; t.hidden = !on; if (on) t.innerHTML = tableHtml(c); else paint(c);
});
function hbars(items, fmt = n0){

}
const kpi = (key, label, value, sub, hero) => `<div class="kpi${hero ? ' hero' : ''}"><div class="kpi-l">${label}</div><div class="kpi-v" data-flash="${key}">${value}</div><div class="kpi-s">${sub}</div></div>`;

   4) หน้าจอแม่แบบ lab (งานตรวจ · Lot · งบประมาณ)

const mk = (M, fy, idx) => M.cases.get(fy*100 + idx);

function yearStat(M, fy){
  let samples = 0, items = 0, months = 0, lastS = 0, lastI = 0, itemsMonths = 0;
  for (let i = 1; i <= 12; i++) { const c = mk(M, fy, i); if (!c) continue;
    if (c.samples != null) { samples += c.samples; months++; lastS = i; }
    if (c.items != null) { items += c.items; itemsMonths++; lastI = i; } }
  const b = M.budget[fy] || { cats: {}, total: 0, waste: 0 };
  const mat = (b.cats['งบดำเนินงาน']||0) + (b.cats['วัสดุวิทย์ฯ']||0) + (b.cats['เหลือจ่าย']||0);
  const lotsY = M.lots.filter(l => l.fy === fy);
  const peak = [...Array(12)].map((_, k) => mk(M, fy, k+1)).reduce((a, c, k) => c && c.samples != null && (!a || c.samples > a.v) ? { v: c.samples, k } : a, null);
  return { fy, samples, items, months, lastS, lastI, itemsMonths, avg: months ? samples / months : null,
    budget: b, total: b.total, mat, perSample: months === 12 && mat > 0 && samples ? mat / samples : null,
    lotN: lotsY.length, lotSamples: lotsY.reduce((a, l) => a + l.samples, 0), peak };
}
function samePeriod(M, fy, last, key){ let s = 0, n = 0; for (let i = 1; i <= last; i++) { const c = mk(M, fy, i); if (c && c[key] != null) { s += c[key]; n++; } } return { s, n }; }

    kpi('avg', 'เฉลี่ยตัวอย่าง / เดือน', n0(a.avg), `<span>ปีก่อน ${n0(pAvg)} · ${a.months} เดือนที่มีข้อมูล</span>`),

    kpi('per', 'บาท / ตัวอย่าง (วัสดุตรวจ)', a.perSample ? n0(a.perSample) : '—', a.perSample ? `${deltaChip(delta(a.perSample, p.perSample))}<span>ปีก่อน ${n0(p.perSample)}</span>` : 'คำนวณเมื่อครบ 12 เดือน'),
    kpi('lot', 'Lot พัสดุ (26–25)', n0(a.lotN), `<span>รวม ${n0(a.lotSamples)} ตัวอย่าง</span>`)

}
function labLatest(M){

  const toolbar = `<div class="toolbar"><label for="cmSel"><b>เดือนที่รับคดี</b></label><select class="sel" id="cmSel"><option value="0">ทุกเดือน (${n0(N)} คดี)</option>${ms.map(o => `<option value="${o.k}"${o.k === S.cm ? ' selected' : ''}>${mFull(o)} (${n0(o.n)} คดี)</option>`).join('')}</select><label><input type="checkbox" id="hideUn"${S.hideUn ? ' checked' : ''}> ซ่อนคดีที่ยังไม่ระบุประเภท/ผู้ตรวจ</label></div>`;
  // A) ประเภทคดีรายเดือน
  const rsT = pickT(rs), per = ms.map(o => rsT.filter(r => r.y*100 + r.m === o.k));
  const chart = chartCard('span-7', { title: 'ประเภทคดีรายเดือน', sub: 'จำนวนคดีแยกตามประเภท · นับตามวันที่รับ', cats: ms.map(mShort), tipCats: ms.map(mFull), catLabel: 'เดือน', h: 280, stacked: true,
    series: tcols.map(k => ({ name: k, color: tcol(k), values: per.map(a => a.filter(r => tkey(r) === k).length) })) });
  const topOf = a => { const c = new Map(); a.forEach(r => { if (r.typ) { const k = tkey(r); c.set(k, (c.get(k) || 0) + 1); } }); const t = [...c].sort((x, y) => y[1] - x[1])[0]; return t ? `${t[0]} (${n0(t[1])})` : '—'; };
  const tTable = `<section class="card span-5"><div class="card-h"><div><h2>ประเภทคดีที่มากที่สุดในแต่ละเดือน</h2><p>นับเฉพาะคดีที่ระบุประเภทแล้ว</p></div></div><div class="scroll" style="max-height:340px"><table><thead><tr><th>เดือน</th><th>คดี</th><th class="l">ประเภทสูงสุด (จำนวน)</th></tr></thead><tbody>${ms.map((o, i) => `<tr><td>${mFull(o)}</td><td>${n0(o.n)}</td><td class="l">${esc(topOf(per[i]))}</td></tr>`).join('')}</tbody></table></div></section>`;
  const mTable = `<section class="card span-12"><div class="card-h"><div><h2>จำนวนคดีแยกประเภท รายเดือน</h2><p>ตารางตัวเลขของกราฟด้านบน</p></div></div><div class="scroll"><table class="mx"><thead><tr><th>เดือน</th>${tcols.map(k => `<th>${esc(k)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${ms.map((o, i) => `<tr><td>${mFull(o)}</td>${tcols.map(k => { const v = per[i].filter(r => tkey(r) === k).length; return v ? `<td>${n0(v)}</td>` : '<td class="z">·</td>'; }).join('')}<td><b>${n0(per[i].length)}</b></td></tr>`).join('')}</tbody></table></div></section>`;
  // ตารางไขว้ทั่วไป
  const xtab = (rows, rk, cols, ck, kind, emptyLabel) => {
    const m = new Map(); rows.forEach(r => { const k = rk(r); const o = m.get(k) || { k, t: 0, c: {} }; o.t++; const c = ck(r); o.c[c] = (o.c[c] || 0) + 1; m.set(k, o); });
    const list = [...m.values()].sort((a, b) => b.t - a.t); if (!list.length) return `<div class="empty">${emptyLabel}</div>`;
    const mx = Math.max(1, ...list.flatMap(o => cols.map(c => o.c[c] || 0))), tot = {}; list.forEach(o => cols.forEach(c => tot[c] = (tot[c] || 0) + (o.c[c] || 0)));
    const dr = o => S.drill && S.drill.k === kind && S.drill.v === o.k;
    return `<div class="scroll"><table class="mx"><thead><tr><th>${kind === 'prov' ? 'จังหวัด' : 'ผู้ตรวจ'}</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${list.map(o => `<tr data-dk="${kind}" data-dv="${esc(o.k)}"${dr(o) ? ' class="dr"' : ''}><td>${esc(o.k)}</td>${cols.map(c => { const v = o.c[c] || 0; return v ? `<td style="background:color-mix(in srgb,var(--s1) ${Math.round(v / mx * 45)}%,transparent)">${n0(v)}</td>` : '<td class="z">·</td>'; }).join('')}<td><b>${n0(o.t)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>รวม</td>${cols.map(c => `<td>${n0(tot[c] || 0)}</td>`).join('')}<td>${n0(list.reduce((s, o) => s + o.t, 0))}</td></tr></tfoot></table></div>`;
  };
  const mxtab = (rows, rk, kind) => {
    const m = new Map(); rows.forEach(r => { const k = rk(r); const o = m.get(k) || { k, t: 0, c: {} }; o.t++; const c = r.y*100 + r.m; o.c[c] = (o.c[c] || 0) + 1; m.set(k, o); });
    const list = [...m.values()].sort((a, b) => b.t - a.t); if (!list.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
    const mx = Math.max(1, ...list.flatMap(o => ms.map(x => o.c[x.k] || 0)));
    return `<div class="scroll"><table class="mx"><thead><tr><th>${kind === 'prov' ? 'จังหวัด' : 'ผู้ตรวจ'}</th>${ms.map(o => `<th>${mShort(o)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${list.map(o => `<tr data-dk="${kind}" data-dv="${esc(o.k)}"${S.drill && S.drill.k === kind && S.drill.v === o.k ? ' class="dr"' : ''}><td>${esc(o.k)}</td>${ms.map(x => { const v = o.c[x.k] || 0; return v ? `<td style="background:color-mix(in srgb,var(--s1) ${Math.round(v / mx * 45)}%,transparent)">${n0(v)}</td>` : '<td class="z">·</td>'; }).join('')}<td><b>${n0(o.t)}</b></td></tr>`).join('')}</tbody></table></div>`;
  };
  const provCard = `<section class="card span-12"><div class="card-h"><div><h2>แต่ละจังหวัดมีคดีอะไรบ้าง · ${esc(mLab)}</h2><p>จำนวนคดีแยกตามประเภท · คลิกแถวเพื่อดูรายการคดี</p></div></div>${xtab(pickT(rsm), r => r.prov || 'ไม่ระบุ', tcols, tkey, 'prov', 'ไม่มีคดีในเดือนนี้')}</section>`;
  const exaCols = tcols, exaCard = `<section class="card span-12"><div class="card-h"><div><h2>ผู้ตรวจแต่ละคนได้คดีอะไรบ้าง · ${esc(mLab)}</h2><p>จำนวนคดีแยกตามประเภท · คลิกแถวเพื่อดูรายการคดี</p></div></div>${xtab(pickE(rsm), r => r.exa || UE, exaCols, tkey, 'exa', 'ไม่มีคดีที่ระบุผู้ตรวจในเดือนนี้')}</section>`;
  const provMx = `<section class="card span-12"><div class="card-h"><div><h2>จังหวัด × เดือน</h2><p>จำนวนคดีทั้งหมดของแต่ละจังหวัดในแต่ละเดือน</p></div></div>${mxtab(rs, r => r.prov || 'ไม่ระบุ', 'prov')}</section>`;
  const exaMx = `<section class="card span-12"><div class="card-h"><div><h2>ผู้ตรวจ × เดือน</h2><p>จำนวนคดีที่ผู้ตรวจแต่ละคนได้รับในแต่ละเดือน</p></div></div>${mxtab(pickE(rs), r => r.exa || UE, 'exa')}</section>`;
  let drill = '';
  if (S.drill) { const d = S.drill, list = rsm.filter(r => (d.k === 'prov' ? (r.prov || 'ไม่ระบุ') : (r.exa || UE)) === d.v).sort((a, b) => a.t - b.t), shown = list.slice(0, 200);
    drill = `<section class="card span-12" id="drillCard"><div class="card-h"><div><h2>รายการคดี · ${esc(d.v)} · ${esc(mLab)}</h2><p>${n0(list.length)} คดี${list.length > shown.length ? ' (แสดง 200 คดีแรก)' : ''} · คลิกแถวเดิมอีกครั้งเพื่อปิด</p></div></div><div class="scroll" style="max-height:480px"><table><thead><tr><th class="l">เลข บก.</th><th class="l">สภ.</th><th class="l">จังหวัด</th><th class="l">วันที่รับ</th><th class="l">ประเภทคดี</th><th class="l">ผู้ตรวจ</th><th>ของกลาง</th><th class="l">สถานะ</th></tr></thead><tbody>${shown.map(r => `<tr><td class="l">${esc(r.bk)}</td><td class="l">${esc(r.pol)}</td><td class="l">${esc(r.prov)}</td><td class="l">${new Date(r.t).getUTCDate()} ${CAL[r.m-1]} ${r.by}</td><td class="l">${r.typ ? esc(r.typ) : '<span class="badge ok">ยังไม่ระบุ</span>'}</td><td class="l">${r.exa ? esc(r.exa) : '<span class="badge ok">ยังไม่ระบุ</span>'}</td><td>${n0(r.items)}</td><td class="l"><span class="badge${r.done ? ' ok' : ''}">${esc(statusOf(r))}</span></td></tr>`).join('')}</tbody></table></div></section>`; }
  return `${toolbar}${cov}<div class="grid">${chart}${tTable}${mTable}${provCard}${exaCard}${drill}${provMx}${exaMx}</div>`;
}

/* =========================================================
   6) แหล่งข้อมูล: Google Sheet (อ่านฝั่งเซิร์ฟเวอร์) และไฟล์ Excel ในเครื่อง
   ========================================================= */
const S = { sources: [], active: null, M: null, tpl: null, fy: null, yr: 0, view: 'overview', lotQ: '', lotLimit: 25, pendF: 'all', pendLimit: 25, cm: 0, hideUn: false, drill: null,
  sig: '', prevKpi: {}, busy: false, gen: 0, error: '', email: '', refreshSec: 120 };
const cur = () => S.sources.find(s => s.id === S.active);
const uid = () => 's' + Math.random().toString(36).slice(2, 8);
function persist(){ try { if (S.active && !S.active.startsWith('file-')) localStorage.setItem('dna-src-as', S.active); } catch (e) {} }
async function seedSources(){
  const info = await RUN('getSources');
  S.email = info.email || ''; S.refreshSec = Math.max(30, +info.refreshSeconds || 120);
  S.sources = (info.sources || []).map(x => ({ id: 'srv-' + x.key, type: 'server', key: x.key, name: x.name, tpl: x.tpl }));
  let saved = null; try { saved = localStorage.getItem('dna-src-as'); } catch (e) {}
  const def = S.sources.find(x => x.key === 'cases') || S.sources[0];
  S.active = S.sources.some(x => x.id === saved) ? saved : def ? def.id : null;
}
async function loadSource(src){
  let book, sig;
  if (src.type === 'server') book = serverBook(src.key);
  else { const b = src.bytes; if (!b) throw new Error('ไม่มีข้อมูลไฟล์ · เลือกไฟล์อีกครั้ง'); sig = 'x' + hash(new Uint8Array(b)); book = await readXlsx(b); }
  const tpl = src.tpl && src.tpl !== 'auto' ? src.tpl : await detectTpl(book, src);
  const tabs = tabsOf(src, tpl), M = tpl === 'lab' ? await buildLab(book, tabs) : await buildCases(book, tabs);
  if (src.type === 'server') sig = await book.sig();
  return { tpl, M, sig };
}

/* ---- โหลด / รีเฟรช / โพลล์ ---- */
let pollT = null;
async function refresh(first){
  const s = cur(); if (!s || S.busy) return; const gen = S.gen; S.busy = true;
  if (first) { s.state = 'busy'; setStatus(); }
  try {
    const r = await loadSource(s); if (gen !== S.gen) return;
    s.err = ''; s.state = s.type === 'server' ? 'live' : 'static'; s.at = new Date();
    if (!s.tpl || s.tpl === 'auto') s.detected = r.tpl;
    if (first || r.sig !== S.sig) { S.sig = r.sig; S.M = r.M; S.tpl = r.tpl; S.error = ''; if (first) resetView(r.tpl); render(); if (!first) toast('อัปเดตข้อมูลจาก Google Sheet แล้ว', 2200); }
    else setStatus();
  } catch (e) {
    if (gen !== S.gen) return; console.warn(e); s.state = 'lost'; s.err = e.message || String(e);
    if (first) { S.M = null; S.tpl = null; S.error = s.err; S.view = 'overview'; render(); } else setStatus();
  } finally { if (gen === S.gen) S.busy = false; }
}
function schedule(){ clearTimeout(pollT); const s = cur(); if (!s || s.type !== 'server') return;
  pollT = setTimeout(async () => { if (!document.hidden) await refresh(false); schedule(); }, S.refreshSec * 1000); }
document.addEventListener('visibilitychange', () => { const s = cur(); if (!document.hidden && s && s.type === 'server') refresh(false).then(schedule); });
function resetView(tpl){ S.fy = null; S.yr = 0; S.lotQ = ''; S.lotLimit = 25; S.pendLimit = 25; S.pendF = 'all'; S.cm = 0; S.drill = null; S.prevKpi = {}; if (!validViews(tpl).includes(S.view)) S.view = 'overview'; }
async function activate(id){
  clearTimeout(pollT); S.gen++; S.busy = false; S.active = id; S.sig = ''; persist();
  const s = cur(); if (s) { s.state = 'busy'; s.err = ''; } S.M = null; S.tpl = null; S.error = ''; render();
  await refresh(true); schedule();
}
const validViews = tpl => ['sources', ...(tpl ? TPL[tpl].nav.map(n => n[0]) : [])];

/* ---- หน้า แหล่งข้อมูล ---- */
function viewSources(){
  const rows = S.sources.map(x => { const on = x.id === S.active, t = x.tpl && x.tpl !== 'auto' ? x.tpl : x.detected;
    const st = x.state === 'live' ? `<span class="badge ok">เชื่อมสด</span>` : x.state === 'lost' ? `<span class="badge bad">เชื่อมต่อไม่ได้</span>` : x.state === 'busy' ? '<span class="badge ok">กำลังโหลด…</span>' : '';
    return `<li class="src${on ? ' on' : ''}"><div><h3>${esc(x.name)} ${on ? '<span class="badge">กำลังแสดง</span>' : ''} ${t ? `<span class="badge ok">${esc(TPL[t].short)}</span>` : ''} ${st}</h3>
      <p>${x.type === 'server' ? 'Google Sheet (ส่วนตัว) อ่านผ่านเซิร์ฟเวอร์ Apps Script · ตรวจข้อมูลใหม่ทุก ' + Math.round(S.refreshSec / 60) + ' นาที' : 'ไฟล์ที่เลือกเอง (อยู่ในเครื่องนี้เท่านั้น ไม่ถูกส่งขึ้นเซิร์ฟเวอร์) · ' + esc(x.fileName || '')}</p>${x.err ? `<p style="color:var(--bad)">${esc(x.err)}</p>` : ''}</div>
      <div class="acts">${on ? '' : `<button class="btn sm" data-act="use" data-id="${x.id}">แสดง</button>`}${x.type === 'file' ? `<button class="btn sm ghost danger" data-act="del" data-id="${x.id}">ลบ</button>` : ''}</div></li>`; }).join('');
  const info = S.M && S.tpl === 'lab' && S.M.notes.length ? `<section class="card span-12"><div class="card-h"><div><h2>หมายเหตุ สมมติฐาน และข้อมูลที่ควรตรวจสอบ</h2><p>อ่านจากแท็บ "หมายเหตุ" ของแหล่งข้อมูลที่แสดงอยู่</p></div></div><ul class="notes">${S.M.notes.map(([a, b]) => b == null ? `<li class="h">${esc(a)}</li>` : `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ul></section>` : '';
  return `<div class="grid">
    <section class="card span-12"><div class="card-h"><div><h2>แหล่งข้อมูล</h2><p>เลือกชุดข้อมูลที่จะแสดงได้ที่มุมขวาบน หรือกด "แสดง"${S.email ? ` · เข้าสู่ระบบเป็น <b>${esc(S.email)}</b>` : ''}</p></div></div><ul class="srcs">${rows || '<li class="src"><div><p>ยังไม่มีแหล่งข้อมูล</p></div></li>'}</ul></section>
    <section class="card span-7"><div class="card-h"><div><h2>ข้อมูลมาจากไหน</h2></div></div><ol class="steps">
      <li><b>Google Sheet เป็นแบบส่วนตัว</b> ไม่ต้องแชร์ "ทุกคนที่มีลิงก์" เซิร์ฟเวอร์ Apps Script อ่านข้อมูลให้เฉพาะผู้ที่มีชื่อในแท็บ <code>ผู้ใช้</code></li>
      <li><b>เปลี่ยนชีต</b> ผู้ดูแลแก้ค่า <code>CASES_SHEET_ID</code> / <code>LAB_SHEET_ID</code> ใน Script Properties (ดูคู่มือ apps-script/README.md)</li>
      <li>แก้ข้อมูลในชีตตามปกติ หน้านี้จะดึงข้อมูลใหม่ทุก ${Math.round(S.refreshSec / 60)} นาที และเมื่อกลับมาเปิดแท็บนี้</li>
      <li>หน้าเว็บไม่อ่านคอลัมน์ User ID (LINE) และไม่แสดง DNA profile</li></ol></section>
    <section class="card span-5"><div class="card-h"><div><h2>แม่แบบที่รองรับ</h2><p>ตรวจอัตโนมัติจากชื่อแท็บ</p></div></div><div class="two" style="grid-template-columns:1fr">
      <div><h4>${TPL.cases.short}</h4>แท็บ <code>ข้อมูลคดี</code> · หัวคอลัมน์: เลข บก. · เลขรายงาน · สภ. (ท้องที่) · จังหวัด · วันที่รับ · วันที่ตรวจเสร็จ · วันที่มารับผล · สถานะ · ประเภทคดี (เลือก) · ผู้ตรวจ (เลือก) · ของกลาง (ชิ้น) · นับในสถิติ · ข้อสังเกต (ผิดปกติ)</div>

    <section class="card span-12"><div class="card-h"><div><h2>ดูจากไฟล์ Excel ในเครื่อง</h2><p>เลือกไฟล์ .xlsx หรือลากมาวางบนหน้านี้ เพื่อดูข้อมูลชั่วคราว ไฟล์ถูกอ่านในเบราว์เซอร์นี้เท่านั้น ไม่ถูกอัปโหลด</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="file">เลือกไฟล์ .xlsx</button></div></section>${info}</div>`;

function removeSource(id){
  const i = S.sources.findIndex(s => s.id === id); if (i < 0) return; const wasActive = id === S.active;
  S.sources.splice(i, 1); if (wasActive && S.sources.length) activate(S.sources[0].id); else render();
}
function fillSel(){
  const sel = $('#srcSel'); sel.innerHTML = S.sources.map(s => `<option value="${s.id}"${s.id === S.active ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  sel.hidden = !S.sources.length;
}
$('#srcSel').onchange = e => { const v = e.target.value; if (v !== S.active) activate(v); };

/* ---- ไฟล์ Excel (ทางเลือก) ---- */
function useFile(name, bytes){
  let s = S.sources.find(x => x.type === 'file');
  if (!s) { s = { id: 'file-' + uid(), type: 'file', tpl: 'auto' }; S.sources.push(s); }
  s.name = 'ไฟล์ · ' + name; s.fileName = name; s.bytes = bytes; S.active = s.id; return s;
}
async function fromFile(f){ if (!f) return; const s = useFile(f.name, await f.arrayBuffer()); clearTimeout(pollT); S.gen++; S.busy = false; S.sig = ''; await refresh(true); fillSel(); if (cur() === s && s.state !== 'lost') toast('โหลดไฟล์ ' + f.name + ' แล้ว'); }
$('#file').onchange = e => { fromFile(e.target.files[0]); e.target.value = ''; };
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').hidden = true; const f = e.dataTransfer.files[0]; if (f && /\.xlsx$/i.test(f.name)) fromFile(f); else toast('รองรับเฉพาะไฟล์ .xlsx'); });

/* =========================================================
   7) แสดงผลทั้งหน้า
   ========================================================= */
function toast(msg, ms = 3200){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }
function setStatus(){
  const s = cur(), el = $('#status'), t = $('#statusTxt');
  if (!s) { el.className = 'pill static'; t.textContent = 'ยังไม่ได้เลือกแหล่งข้อมูล'; return; }
  const when = s.at ? s.at.toLocaleTimeString('th-TH') : '';
  el.className = 'pill ' + (s.state === 'busy' ? 'busy' : s.state === 'live' ? 'live' : s.state === 'lost' ? 'lost' : 'static');
  t.textContent = s.state === 'busy' ? 'กำลังโหลดข้อมูล…' : s.state === 'live' ? `เชื่อมสด · Google Sheet · อัปเดต ${when}` : s.state === 'lost' ? `เชื่อมต่อไม่ได้${when ? ' · ข้อมูลเมื่อ ' + when : ''}` : `โหลดจากไฟล์ · ${when}`;
}
function renderChrome(){
  const T = S.tpl ? TPL[S.tpl] : null;
  $('#nav').innerHTML = (T ? T.nav.map(([v, l, ic]) => `<a href="#${v}" data-v="${v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${ICONS[ic]}</svg>${l}</a>`).join('') + '<hr>' : '') +
    `<a href="#sources" data-v="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS.db}</svg>แหล่งข้อมูล</a>`;
  document.querySelectorAll('#nav a').forEach(a => a.dataset.v === S.view && a.setAttribute('aria-current', 'page'));
  $('#h1').textContent = T ? T.h1 : 'Dashboard งานตรวจ DNA';
  $('#sideFoot').innerHTML = 'กลุ่มงานตรวจชีววิทยาและดีเอ็นเอ' + (T ? '<br>' + T.foot : '');
  fillSel();
  const showChips = S.M && S.view !== 'sources', bar = $('#fyBar'); bar.hidden = !showChips;
  if (showChips) { $('#fyL').textContent = T.chipLabel;
    const items = S.tpl === 'lab' ? S.M.years.map(y => [y, String(y), y === S.fy] ) : [[0, 'ทั้งหมด', S.yr === 0], ...S.M.years.map(y => [y, String(y), y === S.yr])];
    $('#chips').innerHTML = items.map(([v, l, on]) => `<button class="chip" data-y="${v}" aria-pressed="${on}">${l}</button>`).join('');
    const act = document.querySelector('.chip[aria-pressed="true"]'); act && act.scrollIntoView({ block: 'nearest', inline: 'center' }); }
}
function render(){
  if (S.M && S.tpl === 'lab' && S.fy == null) S.fy = (() => { const f = S.M.years.filter(y => yearStat(S.M, y).months >= 6); return f.length ? f.at(-1) : S.M.years.at(-1); })();
  if (S.M && S.tpl === 'lab' && !S.M.years.includes(S.fy)) S.fy = S.M.years.at(-1);
  if (S.M && S.tpl === 'cases' && S.yr && !S.M.years.includes(S.yr)) S.yr = 0;
  if (S.tpl && !validViews(S.tpl).includes(S.view)) S.view = 'overview';
  CHARTS = []; hideTip(); renderChrome();
  let html;
  if (S.view === 'sources') html = viewSources();
  else if (!S.M) { const s = cur();
    html = S.error ? `<div class="card"><div class="msg err"><b>แสดงข้อมูลไม่ได้</b><br>${esc(S.error)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn" data-act="retry">ลองใหม่</button><a class="btn ghost" href="#sources" style="text-decoration:none">ไปหน้าแหล่งข้อมูล</a></div></div>` : '<div class="card empty">กำลังโหลดข้อมูล…</div>'; }
  else html = S.tpl === 'lab' ? (S.view === 'budget' ? labBudget(S.M, S.fy) : S.view === 'lot' ? labLot(S.M, S.fy) : labOverview(S.M, S.fy))
    : (S.view === 'area' ? casesArea(S.M, S.yr) : S.view === 'monthly' ? casesMonthly(S.M, S.yr) : S.view === 'time' ? casesTime(S.M, S.yr) : S.view === 'check' ? casesCheck(S.M) : casesOverview(S.M, S.yr));
  $('#view').innerHTML = html; mountCharts(); setStatus(); bindView();
  const ln = $('#lotN'), lc = $('#lotCount'); if (ln && lc) lc.textContent = ln.textContent;
  const cu = {}; document.querySelectorAll('[data-flash]').forEach(e => { const k = S.active + S.view + e.dataset.flash + S.fy + S.yr; cu[k] = e.textContent; if (k in S.prevKpi && S.prevKpi[k] !== e.textContent) e.classList.add('flash'); });
  S.prevKpi = cu;
}
function bindView(){
  document.querySelectorAll('tr[data-fy],tr[data-yr],tr[data-dk]').forEach(r => { const td = r.cells[0];
    if (td && !td.querySelector('.rowbtn')) td.innerHTML = `<button type="button" class="rowbtn">${td.innerHTML}</button>`; });
  if (S.refocus) { const q = S.refocus; S.refocus = null; const row = [...document.querySelectorAll('tr[data-fy],tr[data-yr],tr[data-dk]')].find(r => (r.dataset.fy || r.dataset.yr || r.dataset.dk + '|' + r.dataset.dv) === q); const b = row && row.querySelector('.rowbtn'); if (b) b.focus(); }
  document.querySelectorAll('tr[data-fy]').forEach(r => r.onclick = () => { S.fy = +r.dataset.fy; S.refocus = r.dataset.fy; render(); });
  document.querySelectorAll('tr[data-yr]').forEach(r => r.onclick = () => { S.yr = +r.dataset.yr; S.refocus = r.dataset.yr; render(); });
  const q = $('#lotQ'); if (q) q.oninput = () => { S.lotQ = q.value; S.lotLimit = 25; $('#lotTbl').innerHTML = lotTable(S.M, S.fy); $('#lotCount').textContent = $('#lotN').textContent; bindView(); };
  const ml = $('#moreLot'); if (ml) ml.onclick = () => { S.lotLimit += 50; const y = scrollY; render(); scrollTo(0, y); };
  const mp = $('#morePend'); if (mp) mp.onclick = () => { S.pendLimit += 50; const y = scrollY; render(); scrollTo(0, y); };
  const pf = $('#pendF'); if (pf) pf.onchange = () => { S.pendF = pf.value; S.pendLimit = 25; render(); };
  const cm = $('#cmSel'); if (cm) cm.onchange = () => { S.cm = +cm.value; S.drill = null; render(); };
  const hu = $('#hideUn'); if (hu) hu.onchange = () => { S.hideUn = hu.checked; render(); };
  document.querySelectorAll('[data-dk]').forEach(r => r.onclick = () => { const d = { k: r.dataset.dk, v: r.dataset.dv }; S.drill = S.drill && S.drill.k === d.k && S.drill.v === d.v ? null : d; S.refocus = d.k + '|' + d.v; render(); const c = $('#drillCard'); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, id = b.dataset.id;
  if (a === 'use') { activate(id); }
  else if (a === 'retry') { if (S.active) activate(S.active); else boot(); }
  else if (a === 'file') $('#file').click();
  else if (a === 'del') { if (b.dataset.arm) removeSource(id); else { b.dataset.arm = '1'; b.textContent = 'ยืนยันลบ?'; setTimeout(() => { b.textContent = 'ลบ'; delete b.dataset.arm; }, 3000); } }
});
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-y]'); if (!b) return; const v = +b.dataset.y; if (S.tpl === 'lab') S.fy = v; else S.yr = v; S.lotLimit = 25; S.pendLimit = 25; render(); });
function route(){ const v = (location.hash || '#overview').slice(1); S.view = v || 'overview'; S.lotLimit = 25; S.pendLimit = 25; if (!validViews(S.tpl).includes(S.view) && S.M) S.view = 'overview'; render(); scrollTo(0, 0); }
addEventListener('hashchange', route);
$('#skip').onclick = e => { e.preventDefault(); $('#view').focus(); };
$('#themeBtn').onclick = () => { const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('dna-theme', root.dataset.theme); } catch (e) {} };
try { const t = localStorage.getItem('dna-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

async function boot(){
  S.view = (location.hash || '#overview').slice(1) || 'overview'; S.error = '';
  try { await seedSources(); }
  catch (e) { console.warn(e); S.error = e.message || String(e); render(); return; }
  if (!S.sources.length) { S.error = 'ผู้ดูแลยังไม่ได้ตั้งค่า Sheet ID (CASES_SHEET_ID / LAB_SHEET_ID) ใน Script Properties'; render(); return; }
  fillSel(); await activate(S.active);
}
boot();
</script>
